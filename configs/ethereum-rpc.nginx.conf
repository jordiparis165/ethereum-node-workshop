limit_req_zone $binary_remote_addr zone=ethereum_requests:1m rate=5r/s;
limit_conn_zone $binary_remote_addr zone=ethereum_connections:1m;

server {
    listen 9443 ssl;
    server_name vps-ae86b6b8.vps.ovh.net;
    ssl_certificate /etc/nginx/ethereum-rpc/tls.crt;
    ssl_certificate_key /etc/nginx/ethereum-rpc/tls.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    auth_basic "Ethereum workshop";
    auth_basic_user_file /etc/nginx/ethereum-rpc/htpasswd;
    client_max_body_size 64k;
    client_body_timeout 10s;
    limit_req zone=ethereum_requests burst=10 nodelay;
    limit_req_status 429;
    limit_conn ethereum_connections 5;
    proxy_connect_timeout 5s;
    proxy_read_timeout 60s;
    proxy_http_version 1.1;
    proxy_set_header Host localhost;
    proxy_set_header Authorization "";

    location = /rpc {
        limit_except POST { deny all; }
        proxy_pass http://127.0.0.1:8545/;
    }

    location = /ws {
        limit_except GET { deny all; }
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host localhost;
        proxy_set_header Authorization "";
        proxy_set_header Origin "";
        proxy_pass http://127.0.0.1:8546/;
    }

    location / { return 404; }
}
